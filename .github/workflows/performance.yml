name: Performance baseline emulator
on:
  workflow_dispatch:
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon :app:assembleDebug
      - name: Measure cold activity start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect
          script: |
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 ci/perf_probe.py | tee perf-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-baseline
          path: perf-results.json
