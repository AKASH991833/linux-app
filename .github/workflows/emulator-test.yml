name: Emulator UI test
on:
  push:
  workflow_dispatch:
jobs:
  emu-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Run emulator UI test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect
          script: |
            adb wait-for-device
            for i in $(seq 1 60); do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break; sleep 2; done
            adb shell input keyevent 82
            mkdir -p "$GITHUB_WORKSPACE/out"
            python3 ci/drive.py 29
      - name: Publish screenshots branch
        if: always()
        run: |
          set -e
          rm -rf /tmp/pub && mkdir -p /tmp/pub && cd /tmp/pub
          git init -q .
          git config user.email actions@github.com
          git config user.name 'github-actions'
          git checkout -q --orphan latest
          cp -r "$GITHUB_WORKSPACE/out"/. . || true
          cat > RUN.md <<EOR
          # Emulator test run ${{ github.run_id }} (API 29)
          Commit: ${{ github.sha }}
          Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOR
          git add -A
          git commit -qm "emulator shots run ${{ github.run_id }}" || true
          git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:refs/heads/emulator-shots-api29
      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-api29
          path: out/
