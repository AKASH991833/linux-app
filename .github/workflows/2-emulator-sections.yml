name: Emulator section screenshots
on:
  workflow_dispatch:

jobs:
  emu-sections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Run targeted emulator section test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect
          script: |
            adb wait-for-device
            for i in $(seq 1 90); do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break; sleep 2; done
            adb shell input keyevent 82
            mkdir -p "$GITHUB_WORKSPACE/out-sections"
            OUT_DIR="$GITHUB_WORKSPACE/out-sections" python3 ci/drive_sections.py 29
      - name: Upload section screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-sections-api29
          path: out-sections/
