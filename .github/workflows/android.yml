name: Android signed APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign release APK with persistent key
        env:
          KEYSTORE_B64: ${{ secrets.LINUX_APP_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LINUX_APP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/linux-app.p12"
          chmod 600 "$RUNNER_TEMP/linux-app.p12"
          SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$SDK_BUILD_TOOLS/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/app-aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/linux-app.p12" --ks-type PKCS12 --ks-key-alias linux-app --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out app/build/outputs/apk/release/linux-app-signed.apk "$RUNNER_TEMP/app-aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/linux-app-signed.apk | grep -F '0e90196bde7bd2300f7d9004e8f52ec142df4b268b224cf13ae71bcadcb98ec1'
          rm -f "$RUNNER_TEMP/linux-app.p12" "$RUNNER_TEMP/app-aligned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app-signed-apk
          path: app/build/outputs/apk/release/linux-app-signed.apk
          if-no-files-found: error
